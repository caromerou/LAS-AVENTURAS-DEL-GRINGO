<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Gringo's World Adventure / La Aventura Mundial de El Gringo</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="game-container">
        <header>
            <span id="scene-counter" class="badge">Scene 1 / Escena 1</span>
            <h1 id="country-title">Peru / Perú</h1>
        </header>

        <main class="story-card">
            <div id="image-container" class="image-box">
                <span id="country-emoji">🇵🇪</span>
            </div>
            
            <p id="story-text" class="text-content">
                Loading adventure... / Cargando aventura...
            </p>

            <div id="choices-container" class="choices-box">
            </div>
        </main>

        <footer>
            <p>El Gringo Interactive Journey &bull; Bilingual Experience</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
